name: Edizione quotidiana

on:
  schedule:
    # 03:17 UTC → 05:17 in Italia con l'ora legale, 04:17 con l'ora solare
    - cron: '17 3 * * *'
  # Quando cambiano le fonti o la pipeline, rigenera subito l'edizione di oggi.
  push:
    branches: [main]
    paths: ['pipeline/**', 'shared/**', '.github/workflows/daily.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Pubblica il sito dopo aver creato l'edizione
        type: boolean
        default: true

permissions:
  contents: write
  models: read

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Raccogli e riassumi i contenuti
        run: npm run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
      - name: Salva l'edizione nel repository
        run: |
          git config user.name "boomscroll-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "Nessuna novità"; exit 0; fi
          git commit -m "Edizione del $(TZ=Europe/Rome date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
