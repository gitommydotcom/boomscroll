name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Chiamato dall'edizione quotidiana dopo aver salvato i nuovi contenuti.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Versione fissa: Playwright (che compone il giornale) supporta Ubuntu 24.04, non ancora la 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          # Sempre l'ultima versione di main, anche quando la chiama l'edizione quotidiana.
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Il giornale da stampare: un PDF per ciascuna delle ultime edizioni, pubblicato con il sito.
      # Grazie alla cache si compone solo l'edizione nuova; se qualcosa va storto il sito esce lo stesso.
      - name: Cache del giornale e di Chromium
        uses: actions/cache@v4
        with:
          path: |
            .stampa
            ~/.cache/ms-playwright
          key: stampa-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: stampa-${{ hashFiles('package-lock.json') }}-
      - name: Prepara Chromium
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - name: Componi il giornale (PDF)
        continue-on-error: true
        run: npm run giornale
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
